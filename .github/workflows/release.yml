name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build and publish Ubuntu 22.04 artifact
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    env:
      ACCEPT_EULA: Y
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release tag
        if: github.event_name == 'push'
        run: |
          package_version="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' package.xml | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Install build and release tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake curl gh git python3-colcon-common-extensions \
            python3-rosdep

      - name: Install ROS dependencies
        run: |
          source /opt/ros/humble/setup.bash
          test -f /etc/ros/rosdep/sources.list.d/20-default.list || rosdep init
          rosdep update
          rosdep install --from-paths . --ignore-src --rosdistro humble -r -y

      - name: Install verified SDK binaries
        run: ./scripts/setup_sdk.sh --accept-sdk-license

      - name: Build and test
        run: |
          ./scripts/build_ros.sh
          source /opt/ros/humble/setup.bash
          source scripts/env.sh
          colcon test --packages-select k4a_ros --event-handlers console_direct+
          colcon test-result --verbose

      - name: Package relocatable ROS install
        run: ./scripts/package_ros.sh

      - name: Attest release artifact
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/*.tar.gz dist/*.sha256 \
              --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: k4a-ros-ubuntu22.04-ros2-humble-amd64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
