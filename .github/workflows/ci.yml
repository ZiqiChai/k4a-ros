name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ros-build:
    name: ROS 2 Humble / ${{ matrix.name }}
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC / C++17
            cc: gcc
            cxx: g++
            cxx_standard: 17
            package_artifact: true
          - name: Clang / C++17
            cc: clang
            cxx: clang++
            cxx_standard: 17
            package_artifact: false
          - name: GCC / C++20 compatibility
            cc: gcc
            cxx: g++
            cxx_standard: 20
            package_artifact: false
    env:
      ACCEPT_EULA: Y
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential clang cmake curl git python3-colcon-common-extensions \
            python3-rosdep shellcheck

      - name: Install ROS dependencies
        run: |
          source /opt/ros/humble/setup.bash
          test -f /etc/ros/rosdep/sources.list.d/20-default.list || rosdep init
          rosdep update
          rosdep install --from-paths k4a_ros --ignore-src --rosdistro humble -r -y

      - name: Select compiler
        run: |
          echo "CC=${{ matrix.cc }}" >> "${GITHUB_ENV}"
          echo "CXX=${{ matrix.cxx }}" >> "${GITHUB_ENV}"

      - name: Check shell scripts
        run: |
          bash -n scripts/*.sh
          shellcheck --severity=warning scripts/*.sh

      - name: Install verified SDK binaries
        run: ./scripts/setup_sdk.sh --accept-sdk-license

      - name: Build ROS package
        run: ./scripts/build_ros.sh -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}

      - name: Run tests
        run: |
          source /opt/ros/humble/setup.bash
          source scripts/env.sh
          colcon test --packages-select k4a_ros --event-handlers console_direct+
          colcon test-result --verbose

      - name: Check installed package and offline replay
        run: |
          source /opt/ros/humble/setup.bash
          source scripts/env.sh
          source install/setup.bash
          ros2 pkg executables k4a_ros
          ros2 launch k4a_ros k4a.launch.py --show-args
          ./scripts/setup_sdk.sh --offline --accept-sdk-license

      - name: Build relocatable ROS artifact
        if: matrix.package_artifact
        run: ./scripts/package_ros.sh

      - name: Attest ROS artifact
        if: matrix.package_artifact && github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Upload ROS artifact
        if: matrix.package_artifact
        uses: actions/upload-artifact@v7
        with:
          name: k4a-ros-ubuntu22.04-ros2-humble-amd64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  sdk-source-build:
    name: SDK source build / GCC
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    env:
      ACCEPT_EULA: Y
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install source-build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake curl git libgl1-mesa-dev libopencv-dev \
            libsoundio-dev libudev-dev libusb-1.0-0-dev libvulkan-dev uuid-dev \
            libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev \
            libxxf86vm-dev pkg-config python3-colcon-common-extensions python3-rosdep

      - name: Install ROS dependencies
        run: |
          source /opt/ros/humble/setup.bash
          test -f /etc/ros/rosdep/sources.list.d/20-default.list || rosdep init
          rosdep update
          rosdep install --from-paths k4a_ros --ignore-src --rosdistro humble -r -y

      - name: Build SDK from pinned source
        run: ./scripts/setup_sdk.sh --method source --accept-sdk-license

      - name: Build and test ROS package
        run: |
          ./scripts/build_ros.sh
          source /opt/ros/humble/setup.bash
          source scripts/env.sh
          colcon test --packages-select k4a_ros --event-handlers console_direct+
          colcon test-result --verbose

      - name: Verify offline source replay
        run: ./scripts/setup_sdk.sh --method source --offline --accept-sdk-license
