name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ros-build:
    name: ROS 2 Humble / GCC / C++17
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    env:
      ACCEPT_EULA: Y
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake curl git python3-colcon-common-extensions \
            python3-rosdep shellcheck udev

      - name: Check scripts
        run: |
          bash -n scripts/*.sh tools/*.sh
          shellcheck --severity=warning scripts/*.sh tools/*.sh

      - name: Install system Azure Kinect SDK
        run: ./scripts/setup_sdk.sh --accept-sdk-license

      - name: Prepare standard ROS workspace
        run: |
          mkdir -p /tmp/k4a_ros_ws/src
          cp -a k4a_ros /tmp/k4a_ros_ws/src/
          source /opt/ros/humble/setup.bash
          test -f /etc/ros/rosdep/sources.list.d/20-default.list || rosdep init
          rosdep update
          rosdep install --from-paths /tmp/k4a_ros_ws/src \
            --ignore-src --rosdistro humble -r -y

      - name: Build package
        run: |
          cd /tmp/k4a_ros_ws
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --cmake-args \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17

      - name: Test installed package
        run: |
          cd /tmp/k4a_ros_ws
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --packages-select k4a_ros --event-handlers console_direct+
          colcon test-result --verbose
          ros2 pkg executables k4a_ros
          ros2 launch k4a_ros k4a.launch.py --show-args

  sdk-recovery-build:
    name: Pinned SDK source recovery
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    env:
      ACCEPT_EULA: Y
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install source-build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git libgl1-mesa-dev \
            libopencv-dev libsoundio-dev libudev-dev libusb-1.0-0-dev \
            libvulkan-dev libx11-dev libxcursor-dev libxinerama-dev \
            libxrandr-dev libxxf86vm-dev pkg-config shellcheck udev uuid-dev

      - name: Download and system-install pinned runtime
        run: ./scripts/setup_sdk.sh --accept-sdk-license

      - name: Rebuild libk4a and assemble system packages
        run: ./tools/build_sdk_system_packages.sh

      - name: Verify recovery package metadata
        run: |
          runtime_deb="$(find dist/sdk-system -name 'libk4a1.4_*_amd64.deb')"
          devel_deb="$(find dist/sdk-system -name 'libk4a1.4-dev_*_amd64.deb')"
          test "$(dpkg-deb -f "${runtime_deb}" Package)" = libk4a1.4
          test "$(dpkg-deb -f "${devel_deb}" Package)" = libk4a1.4-dev
          dpkg-deb -f "${devel_deb}" Depends | grep -Fq \
            "libk4a1.4 (= $(dpkg-deb -f "${runtime_deb}" Version))"
          (cd dist/sdk-system && sha256sum --check SHA256SUMS)

      - name: Verify authorized recovery archive entry
        run: |
          mkdir -p dependencies/cache dependencies/source
          cp /root/.cache/k4a-ros/libk4a1.4_1.4.2_amd64.deb dependencies/cache/
          cp /root/.cache/k4a-ros/libk4a1.4-dev_1.4.2_amd64.deb dependencies/cache/
          cp -a /root/.cache/k4a-ros/source/Azure-Kinect-Sensor-SDK \
            dependencies/source/
          ./tools/package_sdk_recovery_bundle.sh --accept-sdk-license
          archive="$(find dist/sdk-recovery -name '*.tar.gz')"
          (cd "$(dirname "${archive}")" && \
            sha256sum --check "$(basename "${archive}").sha256")
          tar --list --gzip --file "${archive}" > /tmp/sdk-recovery-contents.txt
          grep -Fq dependencies/source/Azure-Kinect-Sensor-SDK/.gitmodules \
            /tmp/sdk-recovery-contents.txt
